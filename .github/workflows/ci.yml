name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: Lint
        run: |
          if [ -f eslint.config.js ] || [ -f .eslintrc* ]; then
            npm run lint || true
          fi
      - name: Build
        run: npm run build

  backend:
    name: Backend Sanity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'src/backend/requirements.txt'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Import check
        run: |
          python - <<'PY'
          import importlib
          for m in ["fastapi", "pydantic", "openai", "pandas"]:
              importlib.import_module(m)
          print("Backend imports OK")
          PY


